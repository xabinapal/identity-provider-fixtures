name: Publish LDAP image

on:
  push:
    tags:
      - ldap/v*

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set image version
        id: version
        run: echo "value=${GITHUB_REF_NAME#ldap/v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./ldap
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/identity-provider-fixtures/ldap:${{ steps.version.outputs.value }}
            ghcr.io/${{ github.repository_owner }}/identity-provider-fixtures/ldap:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
